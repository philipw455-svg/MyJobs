<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work with Philip Werner</title>
<style>
  :root { --bg:#0b1020; --card:#141a2e; --line:#2a3352; --text:#e8ecf6; --muted:#9aa6c4; --accent:#6c8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 16px 64px; }
  h1 { font-size:28px; margin:0 0 6px; }
  p.lead { color:var(--muted); margin:0 0 24px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  label:first-child { margin-top:0; }
  .opt { color:var(--muted); font-weight:400; }
  input, select, textarea { width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:#0f1426; color:var(--text); font:inherit; }
  textarea { min-height:140px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { margin-top:22px; width:100%; padding:13px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .hp { display:none; }
  footer { color:var(--muted); font-size:14px; margin-top:20px; text-align:center; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Work with me</h1>
  <p class="lead">Want to use AI in your business or daily routine? Tell me what you need.</p>
  <form action="https://formsubmit.co/18a693ae15003299f4e2eb2cfe4b22eb" method="POST">
    <input type="hidden" name="_subject" value="New request from your MyJobs page">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://philipw455-svg.github.io/MyJobs/thanks.html">
    <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">

    <label for="name">Name</label>
    <input id="name" name="name" required autocomplete="name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="phone">Phone <span class="opt">(optional)</span></label>
    <input id="phone" name="phone" type="tel" autocomplete="tel">

    <label for="need">What do you need?</label>
    <select id="need" name="need" required>
      <option value="" disabled selected>Choose one</option>
      <option>AI assistant</option>
      <option>Automation</option>
      <option>Website or app</option>
      <option>Help getting started with AI</option>
      <option>Other</option>
    </select>

    <label for="message">Tell me about your project</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">Send message</button>
  </form>
  <footer>Built by Philip Werner · <a href="https://github.com/philipw455-svg/MyJobs">See my projects</a></footer>
</main>
</body>
</html>
